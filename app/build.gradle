plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android" version "1.9.10"
}

// Release signing secrets are NEVER committed.
// Provide via DevicePrivacyLab/local.properties (see local.properties.example)
// or via RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD / RELEASE_KEY_ALIAS env vars.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("local.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStorePassword = keystoreProps.getProperty("RELEASE_STORE_PASSWORD", System.getenv("RELEASE_STORE_PASSWORD") ?: "")
def releaseKeyPassword = keystoreProps.getProperty("RELEASE_KEY_PASSWORD", System.getenv("RELEASE_KEY_PASSWORD") ?: "")
def releaseKeyAlias = keystoreProps.getProperty("RELEASE_KEY_ALIAS", System.getenv("RELEASE_KEY_ALIAS") ?: "deviceprivacylab")

android {
    namespace "dev.hexhydra"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dev.hexhydra"
        minSdk 27
        targetSdk 33
        versionCode 69
        versionName "3.9.4"
    }

    signingConfigs {
        release {
            // Secrets come from local.properties or env vars — never committed.
            // See local.properties.example. Fresh clones without the keystore
            // build unsigned release APKs until signing is configured.
            storeFile file("../release-key.jks")
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            if (file("../release-key.jks").exists() && releaseStorePassword != "" && releaseKeyPassword != "") {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            testCoverageEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    testImplementation "junit:junit:4.13.2"
}

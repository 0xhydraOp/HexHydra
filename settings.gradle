pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // de.robv.android.xposed:api:82 is not on Maven Central; this Nexus
        // mirror proxies it (api.xposed.info is unreachable from some networks).
        maven { url "https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/" }
    }
}

rootProject.name = "HexHydra"
include ":app"
